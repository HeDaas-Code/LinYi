<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Truman Town | 运行仪表盘</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;color:#202a27;background:#f3f6f4;color-scheme:light}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #d9e1dc;padding:12px max(16px,calc((100% - 1440px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:20px;margin:0}main{max-width:1440px;margin:auto;padding:16px}button{font:inherit;border:1px solid #bdcac2;border-radius:4px;background:#fff;color:inherit;min-height:36px;padding:5px 10px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.primary{background:#176b55;color:#fff;border-color:#176b55}.controls,.pacing,.runline{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.toolbar{display:grid;gap:10px;background:#fff;border-bottom:1px solid #d9e1dc;padding:12px 16px}.runline{font-size:13px;color:#4c5b54}.runline b{color:#1f3029}#message{font-size:13px;color:#52635a;min-height:18px}#message.error{color:#a12828}.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid #d9e1dc;background:#d9e1dc;gap:1px;margin:14px 0}.kpi{background:white;padding:10px 12px;min-width:0}.kpi span{display:block;font-size:12px;color:#64736b}.kpi strong{display:block;font-size:20px;margin-top:3px;overflow-wrap:anywhere}.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:#d9e1dc;border:1px solid #d9e1dc}.chart{background:white;padding:12px;min-width:0}.chart h2{font-size:14px;margin:0 0 8px}.chart svg{display:block;width:100%;height:190px;overflow:visible}.legend{font-size:12px;color:#52635a;display:flex;gap:12px;flex-wrap:wrap}.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;background:var(--c)}.empty{font-size:13px;color:#78857e;padding:28px 6px;text-align:center}.tables{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}section{min-width:0}h2.section-title{font-size:15px;margin:0 0 10px}table{width:100%;border-collapse:collapse;background:white;font-size:13px}th,td{padding:8px 9px;text-align:left;border-bottom:1px solid #e4eae6;vertical-align:top;overflow-wrap:anywhere}th{font-weight:600;color:#5c6962;background:#f9fbfa}td small{display:block;color:#66756d;margin-top:3px}.table-wrap{border:1px solid #d9e1dc;overflow:auto}.meter{height:7px;background:#e6ece8;margin-top:4px}.meter i{height:100%;display:block;background:#d58a28}.alive{color:#16704f}.dead{color:#a12828}.result{font-size:12px}.result b{white-space:nowrap}.log{margin-top:18px}.speed.active{background:#dceee6;border-color:#176b55;color:#11523f}@media(max-width:850px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.tables{grid-template-columns:1fr}}@media(max-width:560px){main{padding:12px}.toolbar{padding:10px}.charts{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:10px 12px}.controls button{flex:1 1 28%}.chart svg{height:170px}}
</style></head>
<body><header><h1>Truman Town · 运行仪表盘</h1><button id="refresh" type="button">刷新</button></header>
<div class="toolbar"><div class="controls" aria-label="模拟控制"><button class="primary" data-action="start">启动后台运行</button><button data-action="step">单步</button><button data-action="pause">暂停</button><button data-action="resume">恢复</button><button data-action="stop">停止</button></div><div class="pacing"><strong>倍速</strong><span id="speed-options"></span><span id="pace-label">-- ms/tick</span><span id="background-label">后台状态：--</span></div><div class="runline"><span>phase <b id="phase">--</b></span><span>state <b id="sim-state">--</b></span><span>driver <b id="driver">--</b></span><span>tick <b id="sim-tick">--</b></span><span>居民 <b id="sim-residents">--</b></span><span id="updated">尚未更新</span><span id="message" role="status" aria-live="polite"></span></div></div>
<main><div class="kpis"><div class="kpi"><span>Tick</span><strong id="kpi-tick">--</strong></div><div class="kpi"><span>存活居民</span><strong id="kpi-alive">--</strong></div><div class="kpi"><span>食物库存</span><strong id="kpi-food">--</strong></div><div class="kpi"><span>水库存</span><strong id="kpi-water">--</strong></div><div class="kpi"><span>危机等级</span><strong id="kpi-crisis">--</strong></div><div class="kpi"><span>最近 Tick 提交耗时</span><strong id="kpi-commit">--</strong></div></div>
<div class="charts"><article class="chart"><h2>资源库存趋势</h2><div class="legend" id="stock-legend"></div><div id="stock-chart"></div></article><article class="chart"><h2>资源消耗 / 生产（采样增量）</h2><div class="legend"><span><i style="--c:#d05b45"></i>消耗</span><span><i style="--c:#21835f"></i>生产</span></div><div id="flow-chart"></div></article><article class="chart"><h2>居民需求 · food / water</h2><div class="legend"><span><i style="--c:#d18a24"></i>food</span><span><i style="--c:#2877a8"></i>water</span></div><div id="needs-chart"></div></article><article class="chart"><h2>行动分布</h2><div id="actions-chart"></div></article><article class="chart"><h2>阶段耗时 · 最近 Tick</h2><div id="stages-chart"></div></article></div>
<div class="tables"><section><h2 class="section-title">居民状态 <span id="resident-count"></span></h2><div class="table-wrap"><table><thead><tr><th>居民</th><th>存活</th><th>当前正在做什么</th><th>原因</th><th>food / water need</th></tr></thead><tbody id="residents"></tbody></table></div></section><section class="log"><h2 class="section-title">最近决策与执行日志</h2><div class="table-wrap"><table><thead><tr><th>时间 / Tick</th><th>居民</th><th>当前行动</th><th>原因</th><th>执行结果 · 资源消耗明细</th></tr></thead><tbody id="decisions"></tbody></table></div></section></div></main>
<script>
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={food:'食物',water:'水',energy:'能源',medical:'医疗'},actions={eat:'进食',drink:'饮水',forage:'采集',rest:'休息',work:'工作',build:'建造',trade:'交易',treat:'治疗',explore:'探索',craft:'制作'},colors={food:'#21835f',water:'#2877a8',energy:'#d18a24',medical:'#ad5a87'},history=[];let busy=false,currentSpeed=1;
const byId=id=>document.getElementById(id),num=v=>Number.isFinite(Number(v))?Number(v):0;
async function request(url,options={}){const r=await fetch(url,{headers:{Accept:'application/json','Content-Type':'application/json'},...options});if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||d.message||'HTTP '+r.status)}return r.json()}
function agentsOf(s){const a=s.agents??s.world?.agents??[];return(Array.isArray(a)?a:Object.entries(a).map(([id,x])=>({id,...x}))).map(a=>({...a,id:a.id??a.data?.id,name:a.name??a.data?.name??a.data?.id,alive:a.alive??a.data?.alive,last_action:a.last_action??s.world?.agents?.[a.id]?.last_action,needs:a.needs??s.world?.needs?.[a.id]??{}}))}function stockOf(s){const src=s.resources??s.world?.resources??{};return Object.fromEntries(Object.keys(labels).map(k=>{const x=src[k];return[k,num(x&&typeof x==='object'?(x.stockpile??x.stock??x.amount):x)]}))}function resourceFlow(ds){const o={consumed:{},produced:{}};for(const d of ds){const x=d.execution??{};for(const[key,obj]of[['consumed',x.consumed??x.cost],['produced',x.produced??x.gain]])for(const[k,v]of Object.entries(obj??{}))o[key][k]=(o[key][k]||0)+num(v)}return o}
function drawLines(host,series){if(!series.length||series.every(s=>!s.values.length)){host.innerHTML='<div class="empty">暂无采样数据</div>';return}const w=600,h=180,p=28,max=Math.max(1,...series.flatMap(s=>s.values));let svg=`<svg viewBox="0 0 ${w} ${h}" role="img">`;series.forEach(s=>{if(!s.values.length)return;const points=s.values.map((v,i)=>`${p+i*(w-2*p)/Math.max(1,s.values.length-1)},${h-p-v/max*(h-2*p)}`).join(' ');svg+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" points="${points}"/>`;s.values.forEach((v,i)=>{const x=p+i*(w-2*p)/Math.max(1,s.values.length-1),y=h-p-v/max*(h-2*p);svg+=`<circle cx="${x}" cy="${y}" r="3" fill="${s.color}"><title>Tick ${escapeHtml(s.ticks[i])}: ${escapeHtml(v)}</title></circle>`})});host.innerHTML=svg+'</svg>'}
function drawBars(host,items,color='#2877a8',second=null){if(!items.length){host.innerHTML='<div class="empty">暂无数据</div>';return}const w=600,row=30,h=Math.max(65,items.length*row+15),max=Math.max(1,...items.flatMap(x=>[x.value,x.second??0]));let svg=`<svg viewBox="0 0 ${w} ${h}">`;items.forEach((it,i)=>{const y=i*row+8,label=escapeHtml(it.label),v=num(it.value),sw=Math.max(0,(w-190)*v/max);svg+=`<text x="0" y="${y+12}" font-size="12">${label}</text><rect x="120" y="${y}" width="${sw}" height="9" fill="${color}"><title>${label}: ${escapeHtml(v)}</title></rect><text x="${125+sw}" y="${y+9}" font-size="11">${escapeHtml(v)}</text>`;if(second){const v2=num(it.second),ww=(w-190)*v2/max;svg+=`<rect x="120" y="${y+13}" width="${ww}" height="8" fill="${second}"><title>${label}: ${escapeHtml(v2)}</title></rect>`}});host.innerHTML=svg+'</svg>'}
function render(state,sim,ds,stages){const agents=agentsOf(state),alive=agents.filter(a=>a.alive!==false).length,stocks=stockOf(state),tick=state.tick??sim.committedTick??sim.tick??0;byId('kpi-tick').textContent=tick;byId('sim-tick').textContent=sim.tick??tick;byId('phase').textContent=sim.phase??'--';byId('sim-state').textContent=sim.state??'--';byId('driver').textContent=sim.driver??'none';byId('sim-residents').textContent=agents.length;byId('kpi-alive').textContent=alive+' / '+agents.length;byId('kpi-food').textContent=stocks.food;byId('kpi-water').textContent=stocks.water;const peak=Math.max(0,...agents.map(a=>Math.max(num(a.needs?.food),num(a.needs?.water))));byId('kpi-crisis').textContent=peak>=.8?'高危':peak>=.6?'关注':'正常';byId('kpi-commit').textContent=sim.lastCommit?.totalMs!=null?Number(sim.lastCommit.totalMs).toFixed(1)+' ms':'--';byId('background-label').textContent='后台状态：'+(sim.background?'运行中':'未运行');byId('pace-label').textContent=(sim.pacing?.effectiveMsPerTick??sim.pacing?.msPerTick??'--')+' ms/tick';byId('updated').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN');const flow=resourceFlow(ds),snap={tick,stocks,agents,ds,stages,flow},idx=history.findIndex(x=>x.tick===tick);if(idx>=0)history[idx]=snap;else history.push(snap);history.sort((a,b)=>a.tick-b.tick);while(history.length>30)history.shift();byId('stock-legend').innerHTML=Object.entries(labels).map(([k,v])=>`<span><i style="--c:${colors[k]}"></i>${escapeHtml(v)}</span>`).join('');drawLines(byId('stock-chart'),Object.keys(labels).map(k=>({color:colors[k],values:history.map(x=>x.stocks[k]),ticks:history.map(x=>x.tick)})));const resourceKeys=[...new Set(history.flatMap(x=>[...Object.keys(x.flow.consumed),...Object.keys(x.flow.produced)]))];drawBars(byId('flow-chart'),resourceKeys.map(k=>({label:labels[k]??k,value:history.reduce((n,x)=>n+(x.flow.consumed[k]||0),0),second:history.reduce((n,x)=>n+(x.flow.produced[k]||0),0)})),'#d05b45','#21835f');
byId('residents').innerHTML=agents.map(a=>{const n=a.needs??{},la=a.last_action??a.lastAction??{},action=typeof la==='object'?(la.action??la.currentAction??'—'):la,reason=typeof la==='object'?(la.reason??la.params?.reason??'—'):'—';return`<tr><td>${escapeHtml(a.name??a.id??'未命名')}</td><td class="${a.alive===false?'dead':'alive'}">${a.alive===false?'已故':'存活'}</td><td><strong>${escapeHtml(actions[action]??action)}</strong><small>${escapeHtml(action)}</small></td><td>${escapeHtml(reason)}</td><td>food ${num(n.food).toFixed(2)}<div class="meter"><i style="width:${Math.min(100,Math.max(0,num(n.food)*100))}%"></i></div>water ${num(n.water).toFixed(2)}<div class="meter"><i style="width:${Math.min(100,Math.max(0,num(n.water)*100))}%"></i></div></td></tr>`}).join('')||'<tr><td colspan="5">暂无居民状态</td></tr>';byId('resident-count').textContent='('+agents.length+')';drawBars(byId('needs-chart'),history.flatMap(x=>x.agents.map(a=>({label:`T${x.tick} ${a.name??a.id??'居民'}`,value:num(a.needs?.food),second:num(a.needs?.water)}))).slice(-30),'#d18a24','#2877a8');const counts={};history.forEach(x=>x.ds.forEach(d=>{const a=d.action??d.final?.action??d.finalAction??d.decision??'未知';counts[a]=(counts[a]||0)+1}));drawBars(byId('actions-chart'),Object.entries(counts).map(([label,value])=>({label:actions[label]??label,value})));const stageMap={};history.forEach(x=>(x.stages.recent??[]).filter(t=>t.tick===x.tick).forEach(t=>(t.stages??[]).forEach(s=>{const k=s.id??s.stage??'未知';stageMap[k]=(stageMap[k]||0)+num(s.elapsedMs??s.ms??s.durationMs)})));drawBars(byId('stages-chart'),Object.entries(stageMap).map(([label,value])=>({label,value})),'#98652c');byId('decisions').innerHTML=ds.slice().reverse().map(d=>{const e=d.execution??{},x=e.result??e,cons=Object.entries(x.consumed??x.cost??{}).map(([k,v])=>`${labels[k]??k} ${v}`).join('、')||'无',prod=Object.entries(x.produced??x.gain??{}).map(([k,v])=>`${labels[k]??k} +${v}`).join('、')||'无',action=d.final?.action??d.finalAction??d.decision??d.action,agentId=d.agentId??d.agent_id;return`<tr><td>${escapeHtml(d.at??d.timestamp??'—')}<small>Tick ${escapeHtml(d.tick??'—')}</small></td><td>${escapeHtml(d.agentName??d.agentData?.name??agentId??'—')}</td><td>${escapeHtml(actions[action]??action??'—')}</td><td>${escapeHtml(d.reason??d.thought??'—')}</td><td class="result"><b>cost/consumed</b>: ${escapeHtml(cons)}<br><b>gain/produced</b>: ${escapeHtml(prod)}<br><b>status</b>: ${escapeHtml(x.status??(x.ok===false?'failed':x.ok===true?'ok':'—'))}</td></tr>`}).join('')||'<tr><td colspan="5">暂无决策日志</td></tr>'}
async function refresh(){if(busy)return;const m=byId('message');try{const[s,sim,ds,stages]=await Promise.all([request('/api/v1/world/state'),request('/api/v1/sim/status'),request('/api/v1/sim/decisions?limit=20'),request('/api/v1/sim/stages?limit=30')]);render(s,sim,ds,stages);m.textContent='';m.classList.remove('error')}catch(e){m.textContent='读取失败：'+e.message;m.classList.add('error')}}async function withBusy(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(x=>x.disabled=true);try{await fn()}catch(e){byId('message').textContent='操作失败：'+e.message;byId('message').classList.add('error')}finally{busy=false;document.querySelectorAll('button').forEach(x=>x.disabled=false);await refresh()}}async function pacing(){const d=await request('/api/v1/sim/pacing');currentSpeed=num(d.speed)||1;document.querySelectorAll('.speed').forEach(b=>b.classList.toggle('active',num(b.dataset.speed)===currentSpeed))}const speeds=[.25,.5,1,2,4,8];byId('speed-options').innerHTML=speeds.map(s=>`<button class="speed" data-speed="${s}" type="button">${s}x</button>`).join('');document.querySelectorAll('.speed').forEach(b=>b.onclick=()=>withBusy(async()=>{await request('/api/v1/sim/pacing',{method:'POST',body:JSON.stringify({speed:num(b.dataset.speed)})});await pacing()}));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>withBusy(async()=>{const a=b.dataset.action,body=a==='start'?{background:true,speed:currentSpeed}:a==='step'?{eventProbability:0}:a==='stop'?{wait:true}:{};await request('/api/v1/sim/'+a,{method:'POST',body:JSON.stringify(body)})}));byId('refresh').onclick=()=>withBusy(async()=>{await refresh();await pacing()});pacing().then(refresh).catch(e=>{byId('message').textContent='读取倍速失败：'+e.message;byId('message').classList.add('error')});setInterval(()=>{if(!busy)refresh()},10000);
</script></body></html>
